services:
  obsidian-backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: obsidian-sync-ai-backend
    restart: unless-stopped
    ports:
      - "5125:5125"
    environment:
      - HOST=0.0.0.0
      - PORT=5125
      - VAULT_PATH=/data/vault
      - ARCHIVE_PATH=/data/archive
      - CONFLICTS_PATH=/data/conflicts
      - DB_PATH=/data/sync_manifest.db
      - TEMP_DIR=/data/temp
    env_file:
      - ../server/data/config/.env
    volumes:
      - ../server/data/config:/data/config:ro
      - ../server/data/vault:/data/vault
      - ../server/data/archive:/data/archive
      - ../server/data/conflicts:/data/conflicts
      - ../server/data:/data
